# =================================
# PRODUCTION ENVIRONMENT CONFIGURATION
# =================================

# Application
server.port=8080

# Database - Production Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/codeanalyzer_prod
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# MongoDB - Production Configuration
spring.data.mongodb.host=${SPRING_DATA_MONGODB_HOST}
spring.data.mongodb.port=${SPRING_DATA_MONGODB_PORT}
spring.data.mongodb.database=${SPRING_DATA_MONGODB_DATABASE}
spring.data.mongodb.username=${SPRING_DATA_MONGODB_USERNAME}
spring.data.mongodb.password=${SPRING_DATA_MONGODB_PASSWORD}
spring.data.mongodb.authentication-database=${SPRING_DATA_MONGODB_AUTHENTICATION_DATABASE}

# External Services - Production
external.ollama.base-url=${EXTERNAL_OLLAMA_BASE_URL}
external.chroma.base-url=${EXTERNAL_CHROMA_BASE_URL}
external.chroma.tenant=${EXTERNAL_CHROMA_TENANT}
external.chroma.database=${EXTERNAL_CHROMA_DATABASE}

# Workspace Configuration - Production
app.workspace.directory=./workspace-prod
app.workspace.max-repositories=50
app.workspace.cleanup-on-startup=false

# Processing - Production Limits
processing.max-file-size=10MB
processing.max-concurrent-files=10
processing.chunk-size=2000
processing.chunk-overlap=300

# Groq API Configuration - Production
groq.api.key=${GROQ_API_KEY}
groq.api.base-url=https://api.groq.com/openai/v1
groq.api.model=llama-3.1-70b-versatile
groq.api.temperature=0.1
groq.api.max-tokens=4096

# Security - Production API Key
security.api.key.enabled=true
security.api.key.key=${SECURITY_API_KEY_KEY}

# CORS Configuration - Production (Restricted)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=Content-Type,Authorization,X-API-Key
cors.allow-credentials=false
cors.max-age=3600

# Logging - Minimal for production
logging.level.com.suhas.codeAnalyzer=INFO
logging.level.org.springframework.data.mongodb=WARN
logging.level.root=WARN

# Management Endpoints - Restricted for production
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never