# =================================
# DEVELOPMENT ENVIRONMENT CONFIGURATION
# =================================

# Application
server.port=8080

# Database - H2 In-Memory for Development
spring.datasource.url=jdbc:h2:mem:devdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=dev_password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# MongoDB Configuration for Development
# MongoDB settings are loaded from .env.development file via EnvironmentConfig
# This ensures credentials are not hardcoded in properties files

# External Services - Local Development
external.ollama.base-url=http://localhost:11434
external.ollama.embedding-model=unclemusclez/jina-embeddings-v2-base-code:latest
external.ollama.llm-model=codellama:7b-instruct
external.ollama.slm-model=phi3:3.8b
external.ollama.timeout=120s

external.chroma.base-url=http://localhost:8000
external.chroma.collection-name=java-code-repo-dev
external.chroma.timeout=30s
external.chroma.tenant=default_tenant
external.chroma.database=default_database

# Workspace Configuration - Development
app.workspace.directory=./workspace-dev
app.workspace.max-repositories=10
app.workspace.cleanup-on-startup=true

# Processing - Relaxed limits for development
processing.max-file-size=2MB
processing.max-concurrent-files=3
processing.chunk-size=1000
processing.chunk-overlap=200

# Chat Configuration
chat.agent.enabled=true
chat.agent.session-timeout=3600000
chat.agent.max-sessions=50
chat.force-pattern-matching=false
chat.use-pattern-matching=true
chat.wait-for-completion=false

# Groq API Configuration - Development
groq.api.key=${GROQ_API_KEY}
groq.api.base-url=https://api.groq.com/openai/v1
groq.api.model=llama-3.1-8b-instant
groq.api.temperature=0.1
groq.api.max-tokens=2048
groq.api.timeout=30s

# LLM Provider Configuration - Development
llm.providers.default=groq
llm.providers.analysis=ollama
llm.providers.query=groq
llm.providers.chat=groq
llm.providers.fallback=ollama

# Groq System Prompts - Development
groq.system-prompts.default=You are an expert Java and Spring Boot developer assistant. \
Analyze code and answer questions with: \
- Clear, concise technical explanations \
- Focus on practical implementation details \
- Explanation of Spring Boot patterns and annotations \
- Description of REST endpoints and their purposes \
- Analysis of business logic flows \
- Keep responses under 300 words unless more detail is specifically requested \
Provide accurate, helpful responses based on the code context provided.x

groq.system-prompts.code-analysis=You are an expert Java and Spring Boot developer. \
When analyzing code for REST endpoints:\
\n\nCODE SAMPLE RULES:\
\n- If code contains imports/packages, focus on and show only the method signatures\
\n- For REST endpoints, show method annotations (@RequestMapping, @GetMapping, etc.)\
\n- Format method signatures cleanly without full class context\
\n- Example format: @RequestMapping("/path") public ReturnType methodName(params)\
\n\nANALYSIS FOCUS:\
\n- Identify HTTP methods and URL paths\
\n- Explain endpoint functionality and parameters\
\n- Describe business operations each endpoint performs\
\n- Keep responses practical and under 300 words\
\n\nProvide accurate, helpful responses focusing on the actual functionality rather than boilerplate code.

groq.system-prompts.code-explanation=\
Explain this Java/Spring Boot code clearly and concisely.\
\n\nFocus on:\
\n- What this code does\
\n- Key Spring Boot annotations and their purpose\
\n- Any REST endpoints or business logic\
\n- Dependencies and how they're used\
\n\nKeep the explanation under 200 words.

groq.system-prompts.api-analysis=\
You are a REST API expert analyzing Spring Boot controllers. Extract and present ONLY the REST API endpoints.\
\n\nANALYSIS RULES:\
\n1. Find classes with @RestController, @Controller, or @Path annotations\
\n2. Extract HTTP endpoints (@GetMapping, @PostMapping, @RequestMapping, etc.)\
\n3. IGNORE: @Service, @Repository, @Component, utility classes, main methods, configuration\
\n\nCODE SAMPLE FORMATTING RULES:\
\n1. Show ONLY method signatures with their HTTP annotations\
\n2. EXCLUDE ALL: import statements, package declarations, full class definitions\
\n3. FORMAT: Show clean method signatures like:\
\n   @RequestMapping("/products")\
\n   public String list(Model model)\
\n4. If provided code contains imports, extract and show only the endpoint methods\
\n5. Focus on HTTP method, URL path, parameters, and return type\
\n6. Truncate method bodies to show signature only\
\n\nPresent findings as clear endpoint documentation with HTTP methods and paths.


groq.system-prompts.business-logic=Analyze the business logic flow in this Spring Boot application. \
Focus on: \
- The sequence of operations \
- Service layer interactions \
- Database operations \
- External API calls \
- Error handling \
Provide a step-by-step explanation of the flow.

# API Key Authentication Configuration (ENABLED for testing)
security.api.key.enabled=true
security.api.key.key=codeanalyzer_dev_8VzG9UsCbmVM5CF4qMz92gv4eIQvzT
security.api.key.header-name=X-API-Key

# 🌐 CORS Configuration (Frontend Integration)
cors.allowed-origins=http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
cors.allowed-headers=*
cors.allow-credentials=true
cors.max-age=3600

# Swagger UI - Enabled for development
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui
springdoc.api-docs.enabled=true

# Logging - Verbose for development
logging.level.com.suhas.codeAnalyzer=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.eclipse.jgit=WARN
logging.level.com.suhas.codeAnalyzer.chat=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG

# Management Endpoints - All exposed for debugging
management.endpoints.web.exposure.include=health,info,metrics,env,configprops
management.endpoint.health.show-details=always

# Development flags
debug.mode=true
enable.detailed.logging=true