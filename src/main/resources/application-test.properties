# =================================
# TEST ENVIRONMENT CONFIGURATION
# =================================

# Application
SERVER_PORT=8081

# Database - H2 In-Memory for Testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=test_password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# MongoDB - Test Configuration
spring.data.mongodb.host=${SPRING_DATA_MONGODB_HOST}
spring.data.mongodb.port=${SPRING_DATA_MONGODB_PORT}
spring.data.mongodb.database=${SPRING_DATA_MONGODB_DATABASE}
spring.data.mongodb.username=${SPRING_DATA_MONGODB_USERNAME}
spring.data.mongodb.password=${SPRING_DATA_MONGODB_PASSWORD}
spring.data.mongodb.authentication-database=${SPRING_DATA_MONGODB_AUTHENTICATION_DATABASE}

# External Services - Test
external.ollama.base-url=${EXTERNAL_OLLAMA_BASE_URL}
external.chroma.base-url=${EXTERNAL_CHROMA_BASE_URL}
external.chroma.tenant=${EXTERNAL_CHROMA_TENANT}
external.chroma.database=${EXTERNAL_CHROMA_DATABASE}

# Workspace Configuration - Test
app.workspace.directory=./workspace-test
app.workspace.max-repositories=5
app.workspace.cleanup-on-startup=true

# Processing - Limited for testing
processing.max-file-size=1MB
processing.max-concurrent-files=2
processing.chunk-size=500
processing.chunk-overlap=100

# Groq API Configuration - Test
groq.api.key=${GROQ_API_KEY}
groq.api.base-url=https://api.groq.com/openai/v1
groq.api.model=llama-3.1-8b-instant
groq.api.temperature=0.1
groq.api.max-tokens=1024

# Security - Test API Key
security.api.key.enabled=true
security.api.key.key=${SECURITY_API_KEY_KEY}

# Logging - Debug for testing
logging.level.com.suhas.codeAnalyzer=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG